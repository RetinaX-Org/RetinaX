name: Contract CI

on:
  push:
    paths: ['contracts/**', 'Cargo.toml', 'Cargo.lock']
  pull_request:
    paths: ['contracts/**', 'Cargo.toml', 'Cargo.lock']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  contracts:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [staking, governor, treasury]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p ${{ matrix.package }} --all-targets -- -D warnings
      - run: cargo test -p ${{ matrix.package }} --all-targets
      - run: cargo build -p ${{ matrix.package }} --target wasm32-unknown-unknown --release
      - name: Check WASM artifact
        shell: bash
        run: |
          wasm="target/wasm32-unknown-unknown/release/${{ matrix.package }}.wasm"
          test -s "$wasm"
          echo "${{ matrix.package }} WASM size: $(wc -c < "$wasm") bytes"
