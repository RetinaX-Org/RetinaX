name: Key Manager Contract CI

on:
  push:
    paths:
      - 'contracts/key_manager/**'
      - 'contracts/identity/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'contracts/key_manager/**'
      - 'contracts/identity/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  # Integration suites that currently compile against the contract API.
  # events_test, math_test, time_test and validation_test target APIs that no
  # longer exist and core.rs has a known cooldown failure; add them back here
  # once they are fixed.
  KM_TESTS: --test access_test --test cross_contract_test --test init_test --test policy_test

jobs:
  build-and-test:
    name: Build & Test Key Manager Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -p key_manager -- --check

      - name: Run clippy
        run: cargo clippy -p key_manager --lib $KM_TESTS -- -D warnings

      - name: Build contract
        run: cargo build -p key_manager

      - name: Run unit tests
        run: cargo test -p key_manager --lib

      - name: Run integration tests
        run: cargo test -p key_manager $KM_TESTS

      - name: Run doc tests
        run: cargo test -p key_manager --doc

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -p key_manager -- --check

  clippy-check:
    name: Clippy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy -p key_manager --lib $KM_TESTS -- -D warnings

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov -p key_manager --lib $KM_TESTS --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: key_manager
          fail_ci_if_error: false
