name: Feature Request
description: Suggest a new feature or enhancement for RetinaX
title: "[FEATURE]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature! Please fill out the following information to help us evaluate your proposal.

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature Area
      description: Which area of the protocol does this feature relate to?
      options:
        - Smart Contracts (Soroban/Rust)
        - Frontend / Website
        - SDK / Developer Tools
        - Documentation
        - CI / DevOps
        - Other
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the current limitation or pain point?
      placeholder: Describe the problem or limitation...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or enhancement you would like to see implemented
      placeholder: |
        Describe your proposed solution...
        - What should the feature do?
        - How should it work?
        - What is the expected behavior?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: Describe any alternative solutions or workarounds you have considered...
    validations:
      required: false

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Who would benefit from this feature and how would they use it?
      placeholder: |
        1. As a [type of user], I want [goal] so that [benefit]
        2. ...
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Any technical details, constraints, or implementation suggestions
      placeholder: |
        - Affected contracts/modules:
        - Storage considerations:
        - Security implications:
        - Gas optimization notes:
    validations:
      required: false

  - type: checkboxes
    id: impact
    attributes:
      label: Impact Assessment
      description: What is the expected impact of this feature?
      options:
        - label: Breaking change (requires migration)
        - label: New contract or major module
        - label: Performance improvement
        - label: Security enhancement
        - label: Developer experience improvement
        - label: User experience improvement

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this feature request, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
