[package]
name = "orchestrator"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }
proptest-derive = { workspace = true }

[features]
testutils = ["soroban-sdk/testutils"]

# `autotests = false` at the package level means integration test binaries
# in `tests/` are NOT auto-discovered; each one needs an explicit entry
# here. Register `auth_test.rs` (#421) so `cargo test -p orchestrator`
# runs the new permission/auth coverage.
[[test]]
name = "auth_test"
path = "tests/auth_test.rs"
required-features = ["testutils"]
