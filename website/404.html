<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | RetinaX</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .not-found-content h1 {
      font-size: 8rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .not-found-content p {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-text">RetinaX</span>
      </a>
    </div>
  </header>

  <!-- 404 Section -->
  <section class="not-found-section">
    <div class="container">
      <div class="not-found-content">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The vision record or page you are looking for has been moved or does not exist.</p>
        <a href="index.html" class="btn btn-primary">Return to Homepage</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; justify-content: center;">
        <span>© 2026 RetinaX Protocol. Licensed under MIT.</span>
      </div>
    </div>
  </footer>

</body>
</html>
